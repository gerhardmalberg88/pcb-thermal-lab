[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-thermal-lab"
version = "0.1.0"
description = "File-based KiCad, Gmsh, Elmer and ParaView thermal workflows"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
pcb-thermal = "pcb_thermal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
